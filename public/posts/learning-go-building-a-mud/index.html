    <script>
      (() => {
        const root = document.documentElement;

        const toInk = (hex) => {
          const c = (hex || "#29e3c7").replace("#", "");
          const r = parseInt(c.slice(0, 2), 16) / 255;
          const g = parseInt(c.slice(2, 4), 16) / 255;
          const b = parseInt(c.slice(4, 6), 16) / 255;
          const lin = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
          const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b); 
          return L > 0.55 ? "#0f1115" : "#ffffff"; 
        };

        try {
          const theme =
            localStorage.getItem("site:theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          const accent = localStorage.getItem("site:accent") || "#29e3c7";
          const ink = localStorage.getItem("site:accentInk") || toInk(accent);

          root.setAttribute("data-theme", theme);
          root.style.setProperty("--accent", accent);
          root.style.setProperty("--accent-ink", ink);
        } catch {}
      })();
    </script>

<script defer>
  (() => {
    const root = document.documentElement;
    const $ = (sel, all = false) => (all ? Array.from(document.querySelectorAll(sel)) : document.querySelector(sel));

    function setTheme(t) {
      root.setAttribute("data-theme", t);
      try {
        localStorage.setItem("site:theme", t);
      } catch {}
      updateChecked();
    }
    function setAccent(hex) {
      root.style.setProperty("--accent", hex);
      try {
        localStorage.setItem("site:accent", hex);
      } catch {}
      updateChecked();
    }
    function swatchColor(el) {
      
      return (el.dataset.accent || getComputedStyle(el).getPropertyValue("--swatch")).trim();
    }
    function updateChecked() {
      const theme = root.getAttribute("data-theme");
      const accent = getComputedStyle(root).getPropertyValue("--accent").trim().toLowerCase();
      $(".picker-modes .swatch", true).forEach((b) =>
        b.setAttribute("aria-checked", b.dataset.theme === theme ? "true" : "false")
      );
      $(".picker-accents .swatch", true).forEach((b) => {
        const sw = swatchColor(b).toLowerCase();
        b.setAttribute("aria-checked", sw === accent ? "true" : "false");
      });
    }

    
    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".swatch");
      if (!btn) return;
      if (btn.dataset.theme) setTheme(btn.dataset.theme);
      else setAccent(swatchColor(btn));

      
      if (matchMedia("(max-width: 850px)").matches && $("#theme-drawer")?.dataset.open === "true") setOpen(false);
    });

    
    document.addEventListener("keydown", (e) => {
      if (!e.target.classList?.contains("swatch")) return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        e.target.click();
      }
    });

    
    const fab = $(".theme-fab");
    const drawer = $("#theme-drawer");
    function setOpen(open) {
      if (!drawer || !fab) return;
      drawer.dataset.open = open ? "true" : "false";
      fab.setAttribute("aria-expanded", open ? "true" : "false");
    }
    if (fab && drawer) {
      fab.addEventListener("click", () => setOpen(drawer.dataset.open !== "true"));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setOpen(false);
      });
      document.addEventListener("click", (e) => {
        if (drawer.dataset.open !== "true") return;
        if (e.target.closest(".theme-picker") || e.target.closest(".theme-fab")) return;
        setOpen(false);
      });
    }

    updateChecked();
  })();
</script>

<script data-mud-src="/js/mud-overlay.js">
(function(){
  if (window.__mud_loader) return; window.__mud_loader = true;
  var src = document.currentScript && document.currentScript.getAttribute('data-mud-src') || "\/js\/mud-overlay.js";
  var pendingUrl = null;
  var pendingAnchor = null;
  var loading = false;

  var TRIGGER_SELECTOR = 'a[data-mud],a[data-mud-ws],a[href^="ws"],a[href^="wss"],[data-mud-mount]';

  function findLink(t){
    if (!t) return null;
    var link = t.closest('a[data-mud],a[data-mud-ws],a[href^="ws"],a[href^="wss"]');
    if (link) return link;
    return t.closest('[data-mud-mount]');
  }
  function findFirstLink(){
    var links = document.querySelectorAll(TRIGGER_SELECTOR);
    for (var i = 0; i < links.length; i++) {
      var skip = links[i].getAttribute('data-mud-autostart');
      if (skip && skip.toLowerCase() === 'false') continue;
      return links[i];
    }
    return null;
  }
  function resolveUrl(a){
    if (!a) return '';
    var u = a.getAttribute('data-mud-ws') || '';
    if (!u) { var href = a.getAttribute('href')||''; if (/^wss?:\/\//i.test(href)) u = href; }
    var p = a.getAttribute('data-mud-path');
    if (!u && p) u = (location.protocol==='https:'?'wss://':'ws://') + location.host + p;
    return u;
  }
  function summon(url, anchor){
    if (!url) return;
    var targetAnchor = anchor && anchor.nodeType === 1 ? anchor : null;
    if (window.spawnMudOverlay) {
      if (targetAnchor) {
        window.spawnMudOverlay(url, { anchor: targetAnchor });
      } else {
        window.spawnMudOverlay(url);
      }
      return;
    }

    pendingUrl = url;
    pendingAnchor = targetAnchor;
    if (loading) return;

    loading = true;
    var s = document.createElement('script');
    s.src = src; s.defer = true;
    s.onload  = function(){
      loading = false;
      var target = pendingUrl; pendingUrl = null;
      var anchor = pendingAnchor; pendingAnchor = null;
      if (window.spawnMudOverlay && target) {
        if (anchor) {
          window.spawnMudOverlay(target, { anchor: anchor });
        } else {
          window.spawnMudOverlay(target);
        }
      }
    };
    s.onerror = function(){ loading = false; console.error('Failed to load MUD overlay script at', src); };
    document.head.appendChild(s);
  }

  document.addEventListener('click', function(e){
    var a = findLink(e.target); if (!a || a.tagName !== 'A') return;
    var url = resolveUrl(a);    if (!url) return;
    e.preventDefault();
    summon(url, a);
  }, { capture: true });

  var autoLaunch = false;
  var explicitUrl = null;

  if (autoLaunch) {
    var link = findFirstLink();
    var targetUrl = explicitUrl || resolveUrl(link) || null;
    if (targetUrl) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function(){ summon(targetUrl, link); }, { once: true });
      } else {
        summon(targetUrl, link);
      }
    }
  }
})();
</script>
