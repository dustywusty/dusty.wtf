<div class="theme-picker" id="theme-drawer" aria-label="Theme & color" role="group">
  <div class="picker-accents" role="radiogroup" aria-label="Accent color">
    <!-- circles pull colors from CSS vars by slot -->
    <button class="swatch circle" role="radio" aria-label="Teal" data-slot="1"></button>
    <button class="swatch circle" role="radio" aria-label="Purple" data-slot="2"></button>
    <button class="swatch circle" role="radio" aria-label="Orange" data-slot="3"></button>
    <button class="swatch circle" role="radio" aria-label="Pink" data-slot="4"></button>
    <button class="swatch circle" role="radio" aria-label="Lime" data-slot="5"></button>
  </div>

  <div class="picker-gap" aria-hidden="true"></div>

  <button class="theme-toggle" aria-label="Toggle dark/light mode" id="theme-mode-toggle">🌙</button>
</div>

<!-- Emoji FAB -->
<button class="theme-fab" aria-label="Theme & color" aria-controls="theme-drawer" aria-expanded="false">🎨</button>

<script defer>
  (() => {
    const root = document.documentElement;
    const $ = (sel, all = false) => (all ? Array.from(document.querySelectorAll(sel)) : document.querySelector(sel));

    function currentTheme() {
      return root.getAttribute("data-theme") || "dark";
    }

    function updateModeIcon() {
      const toggle = $("#theme-mode-toggle");
      if (toggle) toggle.textContent = currentTheme() === "dark" ? "🌙" : "☀️";
    }

    function setTheme(t) {
      root.setAttribute("data-theme", t);
      try {
        localStorage.setItem("site:theme", t);
      } catch {}
      updateModeIcon();
      updateChecked();
    }
    function setAccent(hex) {
      root.style.setProperty("--accent", hex);
      try {
        localStorage.setItem("site:accent", hex);
      } catch {}
      updateChecked();
    }
    function swatchColor(el) {
      return (el.dataset.accent || getComputedStyle(el).getPropertyValue("--swatch")).trim();
    }
    function updateChecked() {
      const accent = getComputedStyle(root).getPropertyValue("--accent").trim().toLowerCase();
      $(".picker-accents .swatch", true).forEach((b) => {
        const sw = swatchColor(b).toLowerCase();
        b.setAttribute("aria-checked", sw === accent ? "true" : "false");
      });
    }

    // apply on click — accent swatches
    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".swatch");
      if (!btn) return;
      setAccent(swatchColor(btn));

      // close drawer after a pick
      if ($("#theme-drawer")?.dataset.open === "true") setOpen(false);
    });

    // theme mode toggle
    const modeToggle = $("#theme-mode-toggle");
    if (modeToggle) {
      modeToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        setTheme(currentTheme() === "dark" ? "light" : "dark");
        // close drawer after toggling
        if ($("#theme-drawer")?.dataset.open === "true") setOpen(false);
      });
    }

    // keyboard
    document.addEventListener("keydown", (e) => {
      if (!e.target.classList?.contains("swatch")) return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        e.target.click();
      }
    });

    // drawer toggle (works on both mobile and desktop now)
    const fab = $(".theme-fab");
    const drawer = $("#theme-drawer");
    function setOpen(open) {
      if (!drawer || !fab) return;
      drawer.dataset.open = open ? "true" : "false";
      fab.setAttribute("aria-expanded", open ? "true" : "false");
    }
    if (fab && drawer) {
      fab.addEventListener("click", () => setOpen(drawer.dataset.open !== "true"));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setOpen(false);
      });
      document.addEventListener("click", (e) => {
        if (drawer.dataset.open !== "true") return;
        if (e.target.closest(".theme-picker") || e.target.closest(".theme-fab")) return;
        setOpen(false);
      });
    }

    updateModeIcon();
    updateChecked();
  })();
</script>
