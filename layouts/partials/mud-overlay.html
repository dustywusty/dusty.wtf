{{ if or .Params.mud_overlay .Site.Params.mud_overlay }}
{{- $mudScript := resources.Get "js/mud-overlay.js" | fingerprint -}}
<script data-mud-src="{{ $mudScript.RelPermalink }}">
(function(){
  if (window.__mud_loader) return; window.__mud_loader = true;
  var src = document.currentScript && document.currentScript.getAttribute('data-mud-src') || "{{ $mudScript.RelPermalink }}";
  var pendingUrl = null;
  var pendingAnchor = null;
  var pendingForce = false;
  var loading = false;

  var TRIGGER_SELECTOR = 'a[data-mud],a[data-mud-ws],a[href^="ws"],a[href^="wss"],[data-mud-mount]';

  function findLink(t){
    if (!t) return null;
    var link = t.closest('a[data-mud],a[data-mud-ws],a[href^="ws"],a[href^="wss"]');
    if (link) return link;
    return t.closest('[data-mud-mount]');
  }

  function findFirstLink(){
    var links = document.querySelectorAll(TRIGGER_SELECTOR);
    for (var i = 0; i < links.length; i++) {
      var skip = links[i].getAttribute('data-mud-autostart');
      if (skip && skip.toLowerCase() === 'false') continue;
      return links[i];
    }
    return null;
  }
  function resolveUrl(a){
    if (!a) return '';
    var u = a.getAttribute('data-mud-ws') || '';
    if (!u) { var href = a.getAttribute('href')||''; if (/^wss?:\/\//i.test(href)) u = href; }
    var p = a.getAttribute('data-mud-path');
    if (!u && p) u = (location.protocol==='https:'?'wss://':'ws://') + location.host + p;
    return u;
  }
  function pathToUrl(path){
    if (!path) return '';
    var raw = String(path).trim();
    if (!raw) return '';
    if (/^wss?:\/\//i.test(raw)) return raw;
    if (raw.charAt(0) !== '/') raw = '/' + raw;
    var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    return scheme + location.host + raw;
  }
  function summon(url, anchor, options){
    options = options || {};
    var force = !!options.force;
    if (!url && !force) return;
    var targetAnchor = anchor && anchor.nodeType === 1 ? anchor : null;
    if (window.spawnMudOverlay) {
      var spawnOptions = {};
      if (targetAnchor) spawnOptions.anchor = targetAnchor;
      if (force && !url) spawnOptions.deferConnect = true;
      var opts = Object.keys(spawnOptions).length ? spawnOptions : undefined;
      window.spawnMudOverlay(url || undefined, opts);
      return;
    }

    pendingUrl = url;
    pendingAnchor = targetAnchor;
    pendingForce = force && !url;
    if (loading) return;

    loading = true;
    var s = document.createElement('script');
    s.src = src; s.defer = true;
    s.onload  = function(){
      loading = false;
      var target = pendingUrl; pendingUrl = null;
      var anchor = pendingAnchor; pendingAnchor = null;
      var forceLaunch = pendingForce; pendingForce = false;
      if (window.spawnMudOverlay) {
        var spawnOptions = {};
        if (anchor) spawnOptions.anchor = anchor;
        if (forceLaunch && !target) spawnOptions.deferConnect = true;
        var opts = Object.keys(spawnOptions).length ? spawnOptions : undefined;
        window.spawnMudOverlay(target || undefined, opts);
      }
    };
    s.onerror = function(){
      loading = false;
      if (typeof window !== 'undefined' && typeof window.dispatchEvent === 'function') {
        try {
          window.dispatchEvent(new CustomEvent('mud-overlay-load-error', { detail: { src: src } }));
        } catch (err) {}
      }
    };
    document.head.appendChild(s);
  }

  document.addEventListener('click', function(e){
    var a = findLink(e.target); if (!a || a.tagName !== 'A') return;
    var url = resolveUrl(a);    if (!url) return;
    e.preventDefault();
    summon(url, a);
  }, { capture: true });

  var autoLaunch = {{ if or .Params.mud_autostart .Site.Params.mud_autostart }}true{{ else }}false{{ end }};
  var explicitUrl = {{ with or .Params.mud_ws .Site.Params.mud_ws }}{{ printf "%q" . | safeJS }}{{ else }}null{{ end }};
  var explicitPath = {{ with or .Params.mud_path .Site.Params.mud_path }}{{ printf "%q" . | safeJS }}{{ else }}null{{ end }};

  if (autoLaunch) {
    var link = findFirstLink();
    var targetUrl = explicitUrl || resolveUrl(link) || pathToUrl(explicitPath) || null;
    var summonOptions = targetUrl ? null : { force: true };
    if (targetUrl) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function(){ summon(targetUrl, link); }, { once: true });
      } else {
        summon(targetUrl, link);
      }
    } else if (summonOptions) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function(){ summon(null, link, summonOptions); }, { once: true });
      } else {
        summon(null, link, summonOptions);
      }
    }
  }
})();
</script>
{{ end }}
